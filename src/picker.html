<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
<title>Compartir pantalla</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font:13px/1.4 'Segoe UI',sans-serif;background:#0a1929;color:#fff}
body{display:flex;flex-direction:column}
header{padding:16px 20px 8px}
h1{font-size:16px;font-weight:700;letter-spacing:.5px}
.s{font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
main{flex:1;overflow:auto;padding:4px 20px 12px}
h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#4da6ff;margin:12px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.src{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:10px;cursor:pointer;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#fff;font:inherit;text-align:left}
.src:hover,.src:focus-visible{border-color:#4da6ff;background:rgba(255,255,255,.1);outline:none}
.thumb{width:100%;aspect-ratio:16/9;object-fit:contain;background:#051525;border-radius:6px}
.name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{color:rgba(255,255,255,.5);font-size:12px}
footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 20px;border-top:1px solid rgba(255,255,255,.08)}
button.cancel{padding:8px 16px;border-radius:8px;border:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;font:inherit;cursor:pointer}
button.cancel:hover,button.cancel:focus-visible{border-color:#4da6ff;outline:none}
</style>
</head>
<body>
<header>
  <h1>Compartir pantalla</h1>
  <div class="s">Elige qué quieres mostrar. Nada se comparte hasta que lo elijas.</div>
</header>
<main>
  <h2>Pantallas completas</h2>
  <div class="grid" id="screens"><div class="empty">Buscando…</div></div>
  <h2>Ventanas</h2>
  <div class="grid" id="windows"><div class="empty">Buscando…</div></div>
</main>
<footer>
  <button type="button" class="cancel" id="cancel">Cancelar</button>
</footer>
<script src="picker.js"></script>
</body>
</html>
